# LLM Configuration for PV Test Report Automation
# Configuration for multiple LLM providers

providers:
  anthropic:
    enabled: true
    models:
      - claude-3-opus-20240229
      - claude-3-sonnet-20240229
      - claude-3-haiku-20240307
    api_key_env: ANTHROPIC_API_KEY
    default_model: claude-3-sonnet-20240229
    max_tokens: 4096
    temperature: 0.3
    use_cases:
      - compliance_checking
      - report_generation
      - technical_analysis
      - rca_assistance

  openai:
    enabled: true
    models:
      - gpt-4-turbo-preview
      - gpt-4
      - gpt-3.5-turbo
    api_key_env: OPENAI_API_KEY
    default_model: gpt-4-turbo-preview
    max_tokens: 4096
    temperature: 0.3
    use_cases:
      - data_extraction
      - summarization

  google:
    enabled: true
    models:
      - gemini-1.5-pro
      - gemini-1.5-flash
    api_key_env: GOOGLE_API_KEY
    default_model: gemini-1.5-pro
    max_tokens: 4096
    temperature: 0.3
    use_cases:
      - multimodal_analysis
      - image_interpretation
      - el_analysis
      - ir_analysis

# Task-specific configurations
tasks:
  compliance_checking:
    provider: anthropic
    model: claude-3-sonnet-20240229
    system_prompt: "You are an expert in photovoltaic module testing standards including IEC 61215, IEC 61730, and related standards. Analyze test data for compliance."

  report_generation:
    provider: anthropic
    model: claude-3-opus-20240229
    system_prompt: "Generate comprehensive PV module test reports following laboratory standards and accreditation requirements."

  data_extraction:
    provider: openai
    model: gpt-4-turbo-preview
    system_prompt: "Extract structured data from test documents, Excel files, and measurement reports."

  image_analysis:
    provider: google
    model: gemini-1.5-pro
    system_prompt: "Analyze electroluminescence (EL), infrared (IR), and visual inspection images of PV modules to identify defects."

  rca_analysis:
    provider: anthropic
    model: claude-3-opus-20240229
    system_prompt: "Perform root cause analysis for PV module failures using systematic investigation methodologies."

# Security settings
security:
  api_vault_encryption: true
  rotate_keys: true
  rotation_interval_days: 90
  audit_llm_calls: true

# Rate limiting
rate_limits:
  max_requests_per_minute: 60
  max_tokens_per_day: 1000000

# Caching
caching:
  enabled: true
  ttl_seconds: 3600
  cache_responses: true
