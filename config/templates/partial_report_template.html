<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partial Test Report - {{ report_number }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 15px; }
        .section { margin: 20px 0; }
        .section-title { background-color: #4CAF50; color: white; padding: 8px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <div class="header">
        <h2>PARTIAL TEST REPORT</h2>
        <p>Report No: {{ report_number }} | Date: {{ report_date }}</p>
    </div>

    <div class="section">
        <div class="section-title">Sample Information</div>
        <table>
            <tr><th>Parameter</th><th>Value</th></tr>
            <tr><td>Model</td><td>{{ model_number }}</td></tr>
            <tr><td>Serial Number</td><td>{{ serial_number }}</td></tr>
        </table>
    </div>

    <div class="section">
        <div class="section-title">Test Performed</div>
        <p>{{ test_name }}</p>
        {{ test_results }}
    </div>

    <div class="section">
        <div class="section-title">Status</div>
        <p>{{ status }}</p>
    </div>
</body>
</html>
