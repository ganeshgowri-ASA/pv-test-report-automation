apiVersion: v1
kind: ConfigMap
metadata:
  name: pv-test-config
  namespace: pvtest
data:
  # Application configuration
  APP_NAME: "PV Test Report Automation"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"

  # Database configuration
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"
  DB_POOL_TIMEOUT: "30"

  # Cache configuration
  CACHE_TTL: "300"
  CACHE_MAX_SIZE: "1000"

  # File upload configuration
  MAX_FILE_SIZE: "104857600"  # 100MB
  ALLOWED_EXTENSIONS: ".xlsx,.pdf,.jpg,.png"

  # Report generation
  REPORT_TIMEOUT: "300"
  MAX_CONCURRENT_REPORTS: "5"
---
apiVersion: v1
kind: Secret
metadata:
  name: pv-test-secrets
  namespace: pvtest
type: Opaque
stringData:
  database-url: "postgresql://user:password@postgres:5432/pvtest_db"
  redis-url: "redis://redis:6379/0"
  secret-key: "change-this-to-a-secure-random-key"
  api-key: "your-api-key-here"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pv-test-data
  namespace: pvtest
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
