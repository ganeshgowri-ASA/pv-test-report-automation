apiVersion: apps/v1
kind: Deployment
metadata:
  name: pv-test-automation
  namespace: pvtest
  labels:
    app: pv-test-automation
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pv-test-automation
  template:
    metadata:
      labels:
        app: pv-test-automation
        version: v1
    spec:
      serviceAccountName: pv-test-automation
      containers:
      - name: app
        image: pvtest/automation:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: pv-test-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: pv-test-secrets
              key: redis-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: pv-test-secrets
              key: secret-key
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: app-data
          mountPath: /data
        - name: app-logs
          mountPath: /logs
      volumes:
      - name: app-data
        persistentVolumeClaim:
          claimName: pv-test-data
      - name: app-logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pv-test-automation
  namespace: pvtest
  labels:
    app: pv-test-automation
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: pv-test-automation
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pv-test-automation
  namespace: pvtest
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pv-test-automation-hpa
  namespace: pvtest
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pv-test-automation
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
