version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pv_postgres
    environment:
      POSTGRES_DB: pv_test_automation
      POSTGRES_USER: ${DB_USER:-pv_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pv_admin} -d pv_test_automation"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pv_network

  redis:
    image: redis:7-alpine
    container_name: pv_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pv_network

  minio:
    image: minio/minio
    container_name: pv_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-changeme123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - pv_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pv_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - pv_network

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pv_api_server
    environment:
      DATABASE_URL: postgresql://${DB_USER:-pv_admin}:${DB_PASSWORD:-changeme}@postgres:5432/pv_test_automation
      REDIS_URL: redis://redis:6379
      MINIO_URL: minio:9000
      MINIO_ROOT_USER: ${MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-changeme123}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    networks:
      - pv_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    container_name: pv_celery_worker
    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672
      DATABASE_URL: postgresql://${DB_USER:-pv_admin}:${DB_PASSWORD:-changeme}@postgres:5432/pv_test_automation
      REDIS_URL: redis://redis:6379
      MINIO_URL: minio:9000
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - pv_network

  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: pv_streamlit_app
    environment:
      API_URL: http://api-server:8000
      DATABASE_URL: postgresql://${DB_USER:-pv_admin}:${DB_PASSWORD:-changeme}@postgres:5432/pv_test_automation
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ACCREDITATION_NUMBER: ${ACCREDITATION_NUMBER:-}
      APP_ENV: ${APP_ENV:-production}
    depends_on:
      api-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./assets:/app/assets
      - ./logs:/app/logs
    networks:
      - pv_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: pv_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      streamlit-app:
        condition: service_healthy
    networks:
      - pv_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  pv_network:
    driver: bridge
