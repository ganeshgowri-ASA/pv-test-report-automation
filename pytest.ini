[pytest]
# Pytest configuration for PV Test Report Automation

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests src

# Async test support
asyncio_mode = auto

# Output options
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    --maxfail=10
    -ra
    --color=yes
    --code-highlight=yes
    --durations=10
    --durations-min=1.0

# Coverage options (enabled by default)
addopts =
    --cov=src
    --cov-report=html
    --cov-report=term-missing:skip-covered
    --cov-report=xml
    --cov-fail-under=80
    --cov-branch

# Parallel execution (uncomment to enable)
# addopts =
#     -n auto
#     --dist=loadgroup

# Markers
markers =
    unit: Unit tests
    integration: Integration tests (deselect with '-m "not integration"')
    e2e: End-to-end tests (deselect with '-m "not e2e"')
    qa: QA tests (deselect with '-m "not qa"')
    slow: Slow running tests (deselect with '-m "not slow"')
    browser: Browser-based tests
    visual: Visual regression tests
    regression: Regression tests for bug fixes
    performance: Performance and load tests
    requires_api_key: Tests requiring actual API keys (deselect with '-m "not requires_api_key"')
    requires_database: Tests requiring database connection
    requires_redis: Tests requiring Redis connection
    smoke: Smoke tests for quick validation
    asyncio: Async tests

# Test collection options
norecursedirs =
    .git
    .tox
    .env
    .venv
    venv
    dist
    build
    *.egg
    __pycache__
    node_modules
    .github
    deployment

# Minimum Python version
minversion = 3.9

# Console output
console_output_style = progress

# Log settings
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/test_execution.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(filename)s:%(lineno)d] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:_pytest
    ignore::pytest.PytestUnraisableExceptionWarning

# Timeout (uncomment to enable global timeout)
# timeout = 300
# timeout_method = thread

# xfail behavior
xfail_strict = false

# Doctest options
doctest_optionflags =
    NORMALIZE_WHITESPACE
    IGNORE_EXCEPTION_DETAIL
    ELLIPSIS

# Test ordering
# Run faster tests first
# Requires pytest-order plugin
# order_scope = module

# JUnit XML output
# junit_family = xunit2
# junit_suite_name = PV Test Report Automation Test Suite

# HTML report options (requires pytest-html)
# --html=reports/test-report.html
# --self-contained-html

# Allure report options (requires allure-pytest)
# --alluredir=reports/allure-results
