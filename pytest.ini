[pytest]
# Pytest configuration for PV Test Report Automation

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Coverage options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    audit: Audit trail tests
    lineage: Data lineage tests
    compliance: Compliance reporting tests
    integrity: Integrity checking tests

# Ignore paths
norecursedirs = .git .tox dist build *.egg venv

# Logging
log_cli = false
log_cli_level = INFO
