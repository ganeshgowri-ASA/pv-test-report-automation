[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    slow: Slow running tests
addopts = 
    --verbose
    --cov=src
    --cov-report=html
    --cov-report=term-missing
