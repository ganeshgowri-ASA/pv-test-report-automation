# IEC/ISO Standards Configuration for PV Test Report Automation
# Comprehensive configuration for all relevant photovoltaic testing standards

standards:
  # =========================================================================
  # IEC 61215 Series - Design Qualification and Type Approval
  # =========================================================================
  iec_61215:
    version: "2021"
    full_name: "IEC 61215:2021"
    title: "Terrestrial photovoltaic (PV) modules - Design qualification and type approval"
    scope: "Crystalline silicon terrestrial photovoltaic modules"

    parts:
      - number: 1
        title: "Test requirements"
        description: "General requirements and test methods"
      - number: 2
        title: "Test procedures"
        description: "Specific test procedures and acceptance criteria"

    test_sequence:
      mst_tests: 19
      total_duration_days: 90
      sample_size: 8  # Minimum number of modules required

    test_groups:
      visual_inspection:
        - code: "MST 01"
          name: "Visual inspection"
          duration_hours: 2

      electrical_performance:
        - code: "MST 02"
          name: "Maximum power determination"
          duration_hours: 4
        - code: "MST 03"
          name: "Insulation test"
          duration_hours: 2
        - code: "MST 04"
          name: "Temperature coefficients"
          duration_hours: 8
        - code: "MST 05"
          name: "Nominal operating cell temperature (NOCT)"
          duration_hours: 8
        - code: "MST 06"
          name: "Performance at low irradiance"
          duration_hours: 4
        - code: "MST 07"
          name: "Outdoor exposure test"
          duration_days: 60

      mechanical_stress:
        - code: "MST 08"
          name: "Hot-spot endurance test"
          duration_hours: 5
        - code: "MST 09"
          name: "UV preconditioning test"
          duration_hours: 120
        - code: "MST 10"
          name: "Thermal cycling test"
          duration_days: 10
          cycles: 200
        - code: "MST 11"
          name: "Humidity freeze test"
          duration_days: 8
          cycles: 10
        - code: "MST 12"
          name: "Damp heat test"
          duration_hours: 1000
        - code: "MST 13"
          name: "Robustness of terminations"
          duration_hours: 2
        - code: "MST 14"
          name: "Wet leakage current test"
          duration_hours: 4
        - code: "MST 15"
          name: "Mechanical load test"
          duration_hours: 6
          loads: [2400, -2400]  # Pa (positive and negative)
        - code: "MST 16"
          name: "Hail test"
          duration_hours: 2
          ice_ball_diameter_mm: 25
          impact_velocity_ms: 23
        - code: "MST 17"
          name: "Bypass diode thermal test"
          duration_hours: 8
        - code: "MST 18"
          name: "Reverse current overload test"
          duration_hours: 2
        - code: "MST 19"
          name: "Light soaking test"
          duration_hours: 60

    acceptance_criteria:
      power_degradation_max_percent: 5.0
      wet_leakage_current_max_ua: 50
      insulation_resistance_min_mohm: 40
      ground_continuity_max_ohm: 0.1

  # =========================================================================
  # IEC 61215-1 Series Variants
  # =========================================================================
  iec_61215_1:
    version: "2021"
    full_name: "IEC 61215-1:2021"
    title: "Terrestrial PV modules - Design qualification and type approval - Part 1: Test requirements"
    module_types:
      - "Crystalline silicon"

  iec_61215_1_1:
    version: "2021"
    full_name: "IEC 61215-1-1:2021"
    title: "Special requirements for testing of crystalline silicon modules"

  iec_61215_1_2:
    version: "2021"
    full_name: "IEC 61215-1-2:2021"
    title: "Special requirements for testing of thin-film cadmium telluride (CdTe) modules"

  iec_61215_1_3:
    version: "2021"
    full_name: "IEC 61215-1-3:2021"
    title: "Special requirements for testing of thin-film amorphous silicon modules"

  iec_61215_1_4:
    version: "2021"
    full_name: "IEC 61215-1-4:2021"
    title: "Special requirements for testing of thin-film Cu(In,Ga)(S,Se)2 modules"

  # =========================================================================
  # IEC 61215-2 - Test Procedures
  # =========================================================================
  iec_61215_2:
    version: "2021"
    full_name: "IEC 61215-2:2021"
    title: "Terrestrial PV modules - Design qualification and type approval - Part 2: Test procedures"

  # =========================================================================
  # IEC 61730 Series - Module Safety Qualification
  # =========================================================================
  iec_61730:
    version: "2023"
    full_name: "IEC 61730:2023"
    title: "Photovoltaic (PV) module safety qualification"
    scope: "Safety requirements for PV modules in building and ground-mounted applications"

    parts:
      - number: 1
        title: "Requirements for construction"
        description: "Construction requirements for module safety"
      - number: 2
        title: "Requirements for testing"
        description: "Test procedures for safety qualification"

    safety_classes:
      - class: "A"
        description: "Hazardous voltage"
        voltage_range: "> 1000V DC or > 1500V DC"
      - class: "B"
        description: "Hazardous voltage"
        voltage_range: "> 600V DC and ≤ 1000V DC or > 1000V DC and ≤ 1500V DC"
      - class: "C"
        description: "Reduced hazard"
        voltage_range: "≤ 600V DC or ≤ 1000V DC"

    application_classes:
      - class: "A"
        description: "General access"
        access: "Unlimited public access"
      - class: "B"
        description: "Restricted access"
        access: "Restricted or controlled access"
      - class: "C"
        description: "Controlled access"
        access: "Trained personnel only"

    tests:
      construction_tests:
        - "Sharp edges and corners"
        - "Mechanical strength"
        - "Module securing"
        - "Electrical connections"
        - "Bypass diodes"
        - "Polymeric materials flammability"

      electrical_tests:
        - "Insulation test"
        - "Wet leakage current"
        - "Electric strength"
        - "Ground continuity"

      environmental_tests:
        - "Fire test"
        - "Module breakage"
        - "Strain relief test"

    pass_criteria:
      electric_strength_test_voltage_kv: 3.75  # For modules > 50V
      insulation_test_voltage_kv: 1.0
      ground_continuity_resistance_max_ohm: 0.1

  # =========================================================================
  # IEC 61853 Series - Performance Testing and Energy Rating
  # =========================================================================
  iec_61853:
    version: "2018"
    full_name: "IEC 61853:2018"
    title: "Photovoltaic (PV) module performance testing and energy rating"
    scope: "Performance characterization and energy rating of PV modules"

    parts:
      - number: 1
        title: "Irradiance and temperature performance measurements and power rating"
        year: 2011
        description: "Power rating at various irradiance and temperature conditions"

      - number: 2
        title: "Spectral responsivity, incidence angle and module operating temperature measurements"
        year: 2016
        description: "Spectral response and angular performance"

      - number: 3
        title: "Energy rating of PV modules"
        year: 2018
        description: "Annual energy yield prediction methods"

      - number: 4
        title: "Standard reference climatic profiles"
        year: 2018
        description: "Reference climate zones for energy rating"

    test_conditions:
      standard_test_conditions:
        irradiance_wm2: 1000
        cell_temperature_c: 25
        spectrum: "AM 1.5"

      nominal_operating_conditions:
        irradiance_wm2: 800
        ambient_temperature_c: 20
        wind_speed_ms: 1

      low_irradiance_conditions:
        irradiance_wm2: 200
        cell_temperature_c: 25
        spectrum: "AM 1.5"

    climate_zones:
      - name: "Tropical"
        code: "TR"
        characteristics: "High temperature, high humidity"
      - name: "Subtropical desert"
        code: "SD"
        characteristics: "Very high temperature, low humidity"
      - name: "Temperate coastal"
        code: "TC"
        characteristics: "Moderate temperature, moderate humidity"
      - name: "Temperate continental"
        code: "TM"
        characteristics: "Wide temperature range, moderate humidity"

  # =========================================================================
  # IEC 62804 Series - Potential Induced Degradation (PID)
  # =========================================================================
  iec_62804:
    version: "2020"
    full_name: "IEC 62804-1:2020"
    title: "Photovoltaic (PV) modules - Test methods for the detection of potential-induced degradation"

    parts:
      - number: 1
        title: "Crystalline silicon"
        test_voltage: -1000  # V
        temperature_c: 60
        humidity_percent: 85
        duration_hours: 96

      - number: 2
        title: "Thin-film"
        test_voltage: 500  # V (positive bias)

    acceptance_criteria:
      max_power_degradation_percent: 5.0

  # =========================================================================
  # IEC TS 62788 Series - Measurement Procedures
  # =========================================================================
  iec_ts_62788:
    version: "2017"
    full_name: "IEC TS 62788:2017"
    title: "Measurement procedures for materials used in photovoltaic modules"

    parts:
      - number: 1
        title: "Polymeric encapsulation materials"
      - number: 2
        title: "Frontsheet and backsheet materials"
      - number: 7
        title: "Edge seal durability"

  # =========================================================================
  # IEC 60904 Series - Solar Device Measurements
  # =========================================================================
  iec_60904:
    version: "2020"
    full_name: "IEC 60904:2020"
    title: "Photovoltaic devices"
    scope: "Measurement procedures for PV devices"

    parts:
      - number: 1
        title: "Measurement of photovoltaic current-voltage characteristics"

      - number: 2
        title: "Requirements for reference solar devices"

      - number: 3
        title: "Measurement principles for terrestrial photovoltaic (PV) solar devices with reference spectral irradiance data"

      - number: 5
        title: "Determination of the equivalent cell temperature (ECT) of photovoltaic (PV) devices by the open-circuit voltage method"

      - number: 7
        title: "Computation of the spectral mismatch correction for measurements of photovoltaic devices"

      - number: 8
        title: "Measurement of spectral responsivity of a photovoltaic (PV) device"

      - number: 9
        title: "Solar simulator performance requirements"
        classification:
          spectral_match: ["A", "B", "C"]
          non_uniformity: ["A", "B", "C"]
          temporal_instability: ["A", "B", "C"]
        class_AAA: "Best performance"

      - number: 10
        title: "Methods of linearity measurement"

  # =========================================================================
  # ISO/IEC 17025 - Laboratory Accreditation
  # =========================================================================
  iso_17025:
    version: "2017"
    full_name: "ISO/IEC 17025:2017"
    title: "General requirements for the competence of testing and calibration laboratories"
    scope: "Competence, impartiality and consistent operation of laboratories"

    accreditation_body: "NABL"
    accreditation_full_name: "National Accreditation Board for Testing and Calibration Laboratories"
    country: "India"

    key_requirements:
      management_requirements:
        - "Impartiality"
        - "Confidentiality"
        - "Management system"
        - "Document control"
        - "Review of requests, tenders and contracts"
        - "Selection, verification and validation of methods"
        - "Sampling"
        - "Handling of test items"
        - "Technical records"
        - "Evaluation of measurement uncertainty"
        - "Ensuring validity of results"
        - "Reporting of results"
        - "Complaints"
        - "Nonconforming work"
        - "Control of data and information management"

      technical_requirements:
        - "Personnel competence"
        - "Facilities and environmental conditions"
        - "Equipment calibration and traceability"
        - "Measurement traceability"
        - "Method validation"
        - "Sampling procedures"
        - "Quality assurance of test results"

    calibration_requirements:
      equipment_list:
        - "Solar simulator"
        - "Reference cells"
        - "Temperature sensors"
        - "Humidity sensors"
        - "Pyranometers"
        - "Multimeters"
        - "IV curve tracers"
        - "Environmental chambers"

      calibration_interval_months: 12
      traceability: "SI units through national/international standards"

  # =========================================================================
  # IEC 61829 - On-site Measurement
  # =========================================================================
  iec_61829:
    version: "2015"
    full_name: "IEC 61829:2015"
    title: "Photovoltaic (PV) array - On-site measurement of current-voltage characteristics"
    scope: "Field measurement procedures for installed PV arrays"

  # =========================================================================
  # IEC 62716 - Ammonia Corrosion Testing
  # =========================================================================
  iec_62716:
    version: "2013"
    full_name: "IEC 62716:2013"
    title: "Photovoltaic (PV) modules - Ammonia corrosion testing"
    test_concentration_ppm: 100
    temperature_c: 50
    humidity_percent: 85
    duration_hours: 192

  # =========================================================================
  # IEC 62782 - Dynamic Mechanical Load Testing
  # =========================================================================
  iec_62782:
    version: "2016"
    full_name: "IEC 62782:2016"
    title: "Photovoltaic (PV) modules - Cyclic (dynamic) mechanical load testing"
    cycles: 1000
    load_pa: 1000
    frequency_hz: 0.2

# =============================================================================
# Test Parameters and Configuration
# =============================================================================
test_parameters:
  environmental_conditions:
    standard_test_conditions:
      irradiance_wm2: 1000
      module_temperature_c: 25
      air_mass: 1.5

    nominal_operating_cell_temperature:
      irradiance_wm2: 800
      ambient_temperature_c: 20
      wind_speed_ms: 1
      mounting: "open_rack"

    low_irradiance:
      irradiance_wm2: 200
      module_temperature_c: 25

  measurement_uncertainty:
    irradiance_percent: 2.0
    temperature_c: 1.0
    current_percent: 1.0
    voltage_percent: 0.5
    power_percent: 3.0

  calibration_standards:
    reference_cell_calibration: "ISO 17025 accredited lab"
    pyranometer_calibration: "WRR traceable"
    temperature_sensor_calibration: "NIST traceable"

# =============================================================================
# Reporting Configuration
# =============================================================================
reporting:
  required_sections:
    - "Executive Summary"
    - "Test Sample Information"
    - "Test Equipment and Calibration"
    - "Test Procedures"
    - "Test Results"
    - "Observations and Remarks"
    - "Conclusion"
    - "Annexures"

  test_sample_info:
    - "Manufacturer name and address"
    - "Model number"
    - "Serial numbers"
    - "Rated power"
    - "Module dimensions"
    - "Cell technology"
    - "Frame material"
    - "Junction box details"
    - "Cable specifications"
    - "Date of manufacture"

  equipment_info:
    - "Equipment name"
    - "Manufacturer"
    - "Model number"
    - "Serial number"
    - "Calibration date"
    - "Calibration due date"
    - "Calibration certificate number"
    - "Uncertainty"

  result_tables:
    include_uncertainty: true
    decimal_places:
      power_w: 2
      current_a: 3
      voltage_v: 2
      efficiency_percent: 2
      temperature_c: 1
      irradiance_wm2: 0

  graphs:
    - "I-V curves"
    - "Power curves"
    - "Temperature profiles"
    - "Degradation trends"

# =============================================================================
# Quality and Compliance
# =============================================================================
quality_assurance:
  document_control:
    version_control: true
    review_approval_required: true
    change_log_required: true

  data_integrity:
    electronic_signatures: true
    audit_trail: true
    backup_frequency_days: 1
    retention_period_years: 10

  personnel:
    qualification_requirements:
      - "Technical degree in relevant field"
      - "Training on IEC standards"
      - "Equipment operation training"
      - "ISO 17025 awareness"

    competency_assessment_frequency_months: 12

  proficiency_testing:
    frequency_months: 12
    schemes:
      - "Inter-laboratory comparison"
      - "Round-robin testing"
      - "Reference module testing"

# =============================================================================
# System Metadata
# =============================================================================
metadata:
  config_version: "1.0.0"
  last_updated: "2025-11-18"
  maintained_by: "PV Test Report Automation System"
  standards_review_date: "2025-12-31"
  notes: "Configuration covers all major IEC/ISO standards for PV module testing and certification"
